<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-xl-10">

                <div class="card shadow-lg border-0 rounded-4 mb-4">
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h2 class="mb-0 fw-bold">Comprehensive Diabetes Assessment</h2>
                        <p class="mb-0 opacity-75">AI-Powered Risk Analysis</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form id="predictionForm">
                            <!-- Section 1: Demographics -->
                            <h5 class="text-primary fw-bold mb-3 border-bottom pb-2">1. Demographics</h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Age</label>
                                    <input type="number" class="form-control" id="Age" required min="1" max="120"
                                        placeholder="Years">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="Gender" required>
                                        <option value="" disabled selected>Select...</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Location</label>
                                    <select class="form-select" id="Urban_Rural" required>
                                        <option value="" disabled selected>Select...</option>
                                        <option value="Urban">Urban</option>
                                        <option value="Rural">Rural</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Section 2: Vitals & Body -->
                            <h5 class="text-primary fw-bold mb-3 border-bottom pb-2">2. Vitals & Body Metrics</h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-3">
                                    <label class="form-label">BMI</label>
                                    <input type="number" step="0.1" class="form-control" id="BMI" required
                                        placeholder="e.g. 24.5">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Waist/Hip Ratio</label>
                                    <input type="number" step="0.01" class="form-control" id="Waist_Hip_Ratio" required
                                        placeholder="e.g. 0.90">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Heart Rate</label>
                                    <input type="number" class="form-control" id="Heart_Rate" required
                                        placeholder="BPM">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Cholesterol</label>
                                    <select class="form-select" id="Cholesterol_Level" required>
                                        <option value="Normal">Normal</option>
                                        <option value="Borderline">Borderline</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Section 3: Lifestyle -->
                            <h5 class="text-primary fw-bold mb-3 border-bottom pb-2">3. Lifestyle Habits</h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Physical Activity</label>
                                    <select class="form-select" id="Physical_Activity" required>
                                        <option value="Low">Low</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Diet Type</label>
                                    <select class="form-select" id="Diet_Type" required>
                                        <option value="Veg">Veg</option>
                                        <option value="Non-Veg">Non-Veg</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Sleep Quality</label>
                                    <select class="form-select" id="Sleep_Quality" required>
                                        <option value="Good">Good</option>
                                        <option value="Poor">Poor</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Smoking</label>
                                    <select class="form-select" id="Smoking_Status" required>
                                        <option value="Non-Smoker">Non-Smoker</option>
                                        <option value="Smoker">Smoker</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Alcohol Intake</label>
                                    <select class="form-select" id="Alcohol_Intake" required>
                                        <option value="None">None</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Stress Level</label>
                                    <select class="form-select" id="Stress_Level" required>
                                        <option value="Low">Low</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Section 4: Medical History -->
                            <h5 class="text-primary fw-bold mb-3 border-bottom pb-2">4. Medical History</h5>
                            <div class="row g-4 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Hypertension</label>
                                    <select class="form-select" id="Hypertension" required>
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Family History of Diabetes</label>
                                    <select class="form-select" id="Family_History" required>
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Medication for Chronic Conditions</label>
                                    <select class="form-select" id="Medication_For_Chronic_Conditions" required>
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Thyroid Condition</label>
                                    <select class="form-select" id="Thyroid_Condition" required>
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>

                                <!-- Female Specific (Hidden by default or set to No for Males) -->
                                <div class="col-md-4 female-only d-none">
                                    <label class="form-label">PCOS</label>
                                    <select class="form-select" id="Polycystic_Ovary_Syndrome">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-4 female-only d-none">
                                    <label class="form-label">Gestational Diabetes</label>
                                    <select class="form-select" id="Gestational_Diabetes">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit"
                                class="btn btn-primary w-100 btn-lg mt-3 rounded-pill shadow-sm hover-elevate py-3">
                                Run Full Analysis
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Result Card -->
                <div id="resultCard" class="card shadow border-0 rounded-4 d-none fade-in">
                    <div class="card-body p-5 text-center">
                        <h4 class="text-uppercase text-muted small fw-bold mb-4">Analysis Result</h4>

                        <div class="mb-4">
                            <h2 id="predictionText" class="display-3 fw-bold mb-2">--</h2>
                            <p id="riskDescription" class="text-muted fs-5">Based on your lifestyle and vitals profile.
                            </p>
                        </div>

                        <div class="progress" style="height: 30px; border-radius: 15px; background-color: #e9ecef;">
                            <div id="probabilityBar" class="progress-bar progress-bar-striped progress-bar-animated"
                                role="progressbar" style="width: 0%"></div>
                        </div>
                        <p class="mt-3 mb-0 text-muted">Risk Probability: <span id="probabilityText"
                                class="fw-bold fs-4 text-dark">--%</span></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
